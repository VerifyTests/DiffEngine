version: 2
updates:
- package-ecosystem: nuget
  directory: "/src"
  schedule:
    interval: daily
  open-pull-requests-limit: 10
  groups:
    # SkiaSharp refuses a native library from another version, and the Linux natives are a
    # package of their own, so a bump of one alone fails every Linux job
    skiasharp:
      patterns:
      - "SkiaSharp*"
